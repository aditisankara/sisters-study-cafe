<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c98a5b" />
  <title>Sister's Café — Study Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body data-theme="cafe" data-mode="light">

  <!-- ============ ONBOARDING / PROFILE GATE ============ -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="brand"><span class="brand-mark">☕</span><h1>Sister's Café</h1></div>
      <p class="muted">A cozy place to study. Pick a profile or make a new one.</p>
      <div id="profileList" class="profile-list"></div>
      <form id="newProfileForm" class="new-profile">
        <input id="newProfileName" maxlength="24" placeholder="New profile name…" required />
        <div class="theme-swatches" id="gateThemes"></div>
        <div class="row" id="gateMode">
          <button type="button" class="btn small" data-mode="light">☀️ Light</button>
          <button type="button" class="btn small" data-mode="dark">🌙 Dark</button>
        </div>
        <button class="btn primary" type="submit">Create profile</button>
      </form>
    </div>
  </div>

  <!-- ============ WIDGET (compact) VIEW ============ -->
  <div id="widget" class="widget" hidden>
    <div class="widget-head">
      <span id="widgetProfile" class="widget-profile">—</span>
      <button class="icon-btn" data-open-app title="Open full app">⤢</button>
    </div>
    <div class="widget-timer" id="widgetTimer">45:00</div>
    <div class="widget-actions">
      <button class="btn small" id="widgetStart">Focus</button>
      <button class="btn small ghost" id="widgetReset">Reset</button>
    </div>
    <div class="widget-next">
      <div class="widget-label">Next 7 days</div>
      <ul id="widgetReminders"><li class="muted">Nothing coming up 🌿</li></ul>
    </div>
    <div class="widget-today">
      <div class="widget-label">Today</div>
      <ul id="widgetTasks"><li class="muted">No tasks planned</li></ul>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <div class="brand small"><span class="brand-mark">☕</span><strong>Sister's Café</strong></div>
      <div class="topbar-right">
        <span id="streakPill" class="pill" title="Focus streak">🔥 0</span>
        <span id="levelPill" class="pill" title="Level from focus minutes">Lv 1</span>
        <button class="icon-btn" id="modeToggle" title="Light / dark">🌙</button>
        <button class="icon-btn" id="profileBtn" title="Switch profile"><span id="profileAvatar">🙂</span></button>
      </div>
    </header>

    <nav class="sidenav" id="sidenav">
      <button class="nav-item active" data-view="dashboard">🏠 Dashboard</button>
      <button class="nav-item" data-view="dump">🧠 Task Dump</button>
      <button class="nav-item" data-view="planner">🗓️ Planner</button>
      <button class="nav-item" data-view="calendar">📅 Calendar</button>
      <button class="nav-item" data-view="focus">⏳ Focus</button>
      <button class="nav-item" data-view="reminders">🔔 Reminders</button>
      <button class="nav-item" data-view="stats">📈 Stats</button>
      <button class="nav-item" data-view="settings">⚙️ Settings</button>
    </nav>

    <main class="content" id="content"><!-- views injected here --></main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script src="./js/app.js"></script>
</body>
</html>
